name: verify

# Every push and pull request runs the same gate the maintainer runs before a
# release: rebuild lib/ from src/, the full test suite, the Client bundle smoke
# test and the byte-for-byte reproducibility check (`pnpm verify`).
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      # pnpm is pinned by package.json's `packageManager`; match it explicitly
      # so the workflow keeps working when setup-node's bundled pnpm changes.
      - uses: pnpm/action-setup@v6
        with:
          version: 10.26.2
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify
